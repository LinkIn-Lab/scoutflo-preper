apiVersion: v1
kind: Service
metadata:
  name: lobemint
  namespace: default
  labels:
    app: lobemint
spec:
  type: ClusterIP
  selector:
    app: lobemint
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobemint
  namespace: default
  labels:
    app: lobemint
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lobemint
  template:
    metadata:
      labels:
        app: lobemint
    spec:
      containers:
        - name: lobemint-container
          image: codewithdeepak/damnserver:v1.0.3
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: 500m
          env: []
      imagePullSecrets:
        - name: scoutflo-mintlove-docker

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobemint
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: minloveservice-oumbe.scoutflo.agency
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lobemint
                port:
                  number: 5000
  tls:
    - hosts:
        - minloveservice-oumbe.scoutflo.agency
      secretName: scoutflo-agency-wildcard-tls
